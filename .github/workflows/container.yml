name: Container image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's:.*<ZenitiumDnsVersion>\(.*\)</ZenitiumDnsVersion>.*:\1:p' Directory.Build.props)"
          revision="$(sed -n 's:.*<ZenitiumDnsRevision>\(.*\)</ZenitiumDnsRevision>.*:\1:p' Directory.Build.props)"
          echo "version=$version-$revision" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/dnsbunker/zenitiumdns:${{ steps.version.outputs.version }}
            ghcr.io/dnsbunker/zenitiumdns:latest
