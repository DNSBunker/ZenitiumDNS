<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ZenitiumDNS</title>
<link rel="icon" href="/favicon.ico">
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f6f6;color:#1f2a2c;line-height:1.5}
main{max-width:560px;margin:12vh auto 0;padding:0 20px;text-align:center}
img{width:64px;height:64px}
h1{font-size:26px;margin:12px 0 4px}
.lead{color:#4a5a5d;margin:0 0 24px}
.endpoint{display:inline-block;padding:10px 16px;background:#fff;border:1px solid #d6dfe0;border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;word-break:break-all}
.note{color:#6b7a7d;font-size:13px;margin-top:28px}
@media (prefers-color-scheme:dark){body{background:#141b1c;color:#e3eaeb}.lead{color:#a9b8ba}.endpoint{background:#1d2628;border-color:#324043}.note{color:#8a9a9d}}
</style>
</head>
<body>
<main>
<img src="/img/logo.png" alt="">
<h1>ZenitiumDNS</h1>
<p class="lead">This address is a DNS-over-HTTPS endpoint (RFC 8484). It answers DNS queries from apps and operating systems and is not a website.</p>
<div class="endpoint">https://{host}/dns-query</div>
<p class="note">Enter the address above as DNS-over-HTTPS server in your browser or system settings.</p>
</main>
</body>
</html>
